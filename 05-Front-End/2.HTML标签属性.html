<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML 属性</title>
</head>
<body>
  <!-- 一、超链接标签 a 与 href 属性 -->
  <a href="https://ys.mihoyo.com/">这是一个超链接</a>
  <br>
  <!-- target="_blank" 表示在新标签页中打开链接 -->
  <a href="https://ys.mihoyo.com/" target="_blank">这是在新窗口打开的超链接</a>
  <hr>

  <!-- 二、图片标签 img 与 src、alt 属性 -->
  <img src="lain.jpg" alt="img">
  <hr>
  <!-- 图片路径错误时，浏览器将显示 alt 中的替代文字 -->
  <img src="llain.jpg" alt="该图片无法显示">
  <hr>
  <!-- 使用网络图片地址 -->
  <img src="https://placehold.co/600x400?text=Example+Image" alt="网络图片" width="300" height="200">
  <hr>

</body>
</html>
