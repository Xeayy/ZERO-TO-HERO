<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript 控制语句</title>
</head>
<body>
    <h1>JavaScript 控制语句</h1>

    <script>
        // if...else if...else 条件语句
        const time = 15;
        if (time < 12) {
            console.log('上午好');
        } else if (time < 18) {
            console.log('下午好');
        } else {
            console.log('晚上好');
        }

        console.log('FOR 循环');
        for (let i = 1; i <= 10; i++) {
            console.log(i);
        }

        console.log('while 循环');
        let count = 1;
        while (count <= 10) {
            console.log(count);
            count++;
        }

        console.log('循环关键字');
        for (var i = 0; i < 7; i++) {
            if (i === 2) {
                continue;
            }

            if (i === 4) {
                break;
            }

            console.log(i);
        }
    </script>
</body>
</html>
