<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Fetch 数据交互验证</title>
</head>
<body>
  <h2>打开 F12 控制台查看网络请求结果</h2>
  <button id="fetch-btn">获取测试数据</button>

  <script>
    const btn = document.querySelector('#fetch-btn');

    btn.addEventListener('click', async () => {
      try {
        console.log('正在发送请求...');
        // 向公共测试 API 发送 GET 请求
        const response = await fetch('https://jsonplaceholder.typicode.com/posts/1');
        
        // 将响应解析为 JSON 对象
        const data = await response.json();
        
        console.log('成功拿到后端返回的 JSON 数据：', data);
        console.log('文章标题：', data.title);
      } catch (error) {
        console.error('请求出错：', error);
      }
    });
  </script>
</body>
</html>
