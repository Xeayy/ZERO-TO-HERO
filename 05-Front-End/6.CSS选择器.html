<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 选择器</title>

    <style>
        /* 元素选择器：选择页面中所有 h2 元素 */
        h2 {
            color: aqua;
        }

        /* 类选择器：选择 class 属性为 highlight 的元素 */
        .highlight {
            background-color: yellow;
        }

        /* ID 选择器：选择 id 属性为 header 的元素 */
        #header {
            font-size: 35px;
        }

        /*通用选择器*/
        *{
            font-family: "kaiti";
        }
    </style>
</head>
<body>
    <h1>不同类型的 CSS 选择器</h1>

    <h2>这是一个元素选择器示例</h2>
    <h3 class="highlight">这是一个类选择器示例</h3>
    <h3>这是另一个类选择器示例</h3>

    <h4 id="header">这是一个 ID 选择器示例</h4>
</body>
</html>
