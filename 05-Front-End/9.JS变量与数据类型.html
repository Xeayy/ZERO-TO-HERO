<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript 变量与数据类型</title>
</head>
<body>
    <h1>JavaScript 变量与数据类型</h1>

    <script>
        // 使用 var 声明变量，未赋值时默认值为 undefined。
        var x;

        // 使用 let 声明可以重新赋值的变量。
        let y = 5;

        // 使用 const 声明常量，声明后不能重新赋值。
        const PI = 3.14;
        console.log(x, y, PI);

        // 字符串类型：使用引号包裹文本。
        let name = '如花';
        console.log(name);

        // null 表示变量当前没有对象值。
        let empty_value = null;
        console.log(empty_value);
    </script>
</body>
</html>
